name = "crms-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
# Updated: Force redeploy - public/submit endpoint fix

[[d1_databases]]
binding = "DB"
database_name = "crms-db"
database_id = "1e9c3b4c-8327-41f9-a02c-76367476214c"
migrations_dir = "../../packages/db/migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "ce6d512002fd41f28e7d00f17b56161a"

[[queues.producers]]
binding = "EMAIL_QUEUE"
queue = "crms-email-queue"

[[queues.consumers]]
queue = "crms-email-queue"
max_batch_size = 10
max_batch_timeout = 5

[vars]
ENVIRONMENT = "production"
APP_URL = "https://it.audydental.com"
B2_ENDPOINT = "https://s3.us-east-005.backblazeb2.com"
B2_BUCKET_NAME = "crms-attachments"
B2_REGION = "us-east-005"

# Staging environment
[env.staging]
name = "crms-api-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "crms-db-staging"
database_id = "PLACEHOLDER_STAGING_DB_ID"
migrations_dir = "../../packages/db/migrations"

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "PLACEHOLDER_STAGING_KV_ID"

[[env.staging.queues.producers]]
binding = "EMAIL_QUEUE"
queue = "crms-email-queue-staging"

[[env.staging.queues.consumers]]
queue = "crms-email-queue-staging"
max_batch_size = 10
max_batch_timeout = 5

[env.staging.vars]
ENVIRONMENT = "staging"
APP_URL = "https://staging.crms-audy.pages.dev"
B2_ENDPOINT = "https://s3.us-east-005.backblazeb2.com"
B2_BUCKET_NAME = "crms-attachments-staging"
B2_REGION = "us-east-005"

[dev]
port = 8787
local_protocol = "http"
